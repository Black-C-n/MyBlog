spring.application.name=myblog-java
server.port=8080
server.servlet.session.timeout=30m

# MySQL：先执行 database/create_database.sql，再导入 database/blogdb.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blogdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 直接映射 Django 已有业务表，不让 Hibernate 擅自修改原数据库
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# 新上传的图片保存在 Java 工程内部，不再依赖外层 Python 项目。
# IDEA 默认以当前 Maven 模块作为工作目录，因此会写入 myblog-Java/myblog-Java/storage/media。
app.upload-dir=${MYBLOG_UPLOAD_DIR:${user.dir}/storage/media}
