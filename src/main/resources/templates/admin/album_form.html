<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head(${title})}"></head><body class="change-form"><div id="container">
<div th:replace="~{admin/fragments :: header}"></div><div th:replace="~{admin/fragments :: breadcrumbs('图片墙管理')}"></div><div th:replace="~{admin/fragments :: navigation}"></div><main class="content"><div id="content"><h1 th:text="${title}"></h1><div id="content-main"><form method="post" enctype="multipart/form-data"><fieldset class="module aligned wide">
<div class="form-row"><div><label for="title">标题:</label><input id="title" name="title" class="vTextField" maxlength="50" th:value="${item.title}"></div></div>
<div class="form-row"><div><label for="introduce">描述:</label><input id="introduce" name="introduce" class="vTextField" maxlength="200" th:value="${item.introduce}"></div></div>
<div class="form-row required"><div><label for="photoFile">图片:</label><span th:if="${item.photo != null and !item.photo.isBlank()}"><a th:href="@{/media/{path}(path=${item.photo})}" th:text="${item.photo}"></a><br><img class="preview-image" th:src="@{/media/{path}(path=${item.photo})}" alt="图片"><br></span><input id="photoFile" name="photoFile" type="file" accept="image/*" th:required="${item.id == null}"></div></div>
</fieldset><div class="submit-row"><input type="submit" value="保存" class="default"></div></form></div></div></main></div></body></html>
