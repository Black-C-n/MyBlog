<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head(${title})}"></head><body class="change-list"><div id="container">
<div th:replace="~{admin/fragments :: header}"></div><div th:replace="~{admin/fragments :: breadcrumbs('图片墙管理')}"></div><div th:replace="~{admin/fragments :: navigation}"></div><main class="content"><div id="content"><h1 th:text="${title}"></h1><ul class="messagelist" th:if="${message}"><li th:text="${message}"></li></ul><div id="content-main"><ul class="object-tools"><li><a href="/admin/album/albuminfo/add/" class="addlink">增加 图片墙管理</a></li></ul><div id="changelist" class="module"><div class="results"><table id="result_list"><thead><tr><th>ID</th><th>图片</th><th>标题</th><th>描述</th><th>路径</th><th>操作</th></tr></thead><tbody>
<tr th:each="item : ${albums}"><td th:text="${item.id}"></td><td><img class="preview-image" th:src="@{/media/{path}(path=${item.photo})}" alt="图片"></td><th><a th:href="@{/admin/album/albuminfo/{id}/change/(id=${item.id})}" th:text="${item.title}"></a></th><td th:text="${item.introduce}"></td><td th:text="${item.photo}"></td><td><form class="inline-delete" th:action="@{/admin/album/albuminfo/{id}/delete/(id=${item.id})}" method="post" onsubmit="return confirm('确定删除这张图片记录吗？')"><button class="deletelink" type="submit">删除</button></form></td></tr>
</tbody></table></div></div></div></div></main></div></body></html>
