<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head(${title})}"></head><body class="change-list"><div id="container">
<div th:replace="~{admin/fragments :: header}"></div><div th:replace="~{admin/fragments :: breadcrumbs('博客留言')}"></div><div th:replace="~{admin/fragments :: navigation}"></div><main class="content"><div id="content"><h1 th:text="${title}"></h1><ul class="messagelist" th:if="${message}"><li th:text="${message}"></li></ul><div id="content-main"><ul class="object-tools"><li><a href="/admin/interflow/board/add/" class="addlink">增加 博客留言</a></li></ul><div id="changelist" class="module"><div class="results"><table id="result_list"><thead><tr><th>ID</th><th>留言用户</th><th>邮箱地址</th><th>留言内容</th><th>创建时间</th><th>操作</th></tr></thead><tbody>
<tr th:each="item : ${boards}"><td th:text="${item.id}"></td><th><a th:href="@{/admin/interflow/board/{id}/change/(id=${item.id})}" th:text="${item.name}"></a></th><td th:text="${item.email}"></td><td th:text="${item.content}"></td><td th:text="${#temporals.format(item.created,'yyyy-MM-dd HH:mm')}"></td><td><form class="inline-delete" th:action="@{/admin/interflow/board/{id}/delete/(id=${item.id})}" method="post" onsubmit="return confirm('确定删除这条留言吗？')"><button class="deletelink" type="submit">删除</button></form></td></tr>
</tbody></table></div></div></div></div></main></div></body></html>
