<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head(${title})}"></head><body class="change-list"><div id="container">
<div th:replace="~{admin/fragments :: header}"></div><div th:replace="~{admin/fragments :: breadcrumbs('博文分类')}"></div><div th:replace="~{admin/fragments :: navigation}"></div><main class="content"><div id="content"><h1 th:text="${title}"></h1><ul class="messagelist" th:if="${message}"><li th:text="${message}"></li></ul><div id="content-main"><ul class="object-tools"><li><a href="/admin/article/articletag/add/" class="addlink">增加 博文分类</a></li></ul><div id="changelist" class="module"><div class="results"><table id="result_list"><thead><tr><th>ID</th><th>标签</th><th>操作</th></tr></thead><tbody>
<tr th:each="item : ${tags}"><td th:text="${item.id}"></td><th><a th:href="@{/admin/article/articletag/{id}/change/(id=${item.id})}" th:text="${item.tag}"></a></th><td><form class="inline-delete" th:action="@{/admin/article/articletag/{id}/delete/(id=${item.id})}" method="post" onsubmit="return confirm('确定删除这个分类吗？')"><button class="deletelink" type="submit">删除</button></form></td></tr>
</tbody></table></div></div></div></div></main></div></body></html>
