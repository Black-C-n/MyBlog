<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body class="change-list">
<div id="container"><div th:replace="~{admin/fragments :: header}"></div><div th:replace="~{admin/fragments :: breadcrumbs('用户')}"></div><div th:replace="~{admin/fragments :: navigation}"></div>
<main id="content-start" class="content"><div id="content" class="flex"><h1 th:text="${title}">用户</h1>
<ul class="messagelist" th:if="${message}"><li th:text="${message}">修改成功</li></ul>
<div id="content-main"><div id="changelist" class="module"><div class="changelist-form-container"><div class="results"><table id="result_list"><thead><tr><th>用户名</th><th>电子邮件地址</th><th>姓名</th><th>公司</th><th>职业</th><th>电话</th><th>头像</th></tr></thead><tbody>
<tr th:each="item : ${users}"><th><a th:href="@{/admin/account/myuser/{id}/change/(id=${item.id})}" th:text="${item.username}">admin</a></th><td th:text="${item.email}"></td><td th:text="${item.name}"></td><td th:text="${item.company}"></td><td th:text="${item.profession}"></td><td th:text="${item.telephone}"></td><td th:text="${item.photo}"></td></tr>
</tbody></table></div></div></div></div></div></main></div>
</body></html>
