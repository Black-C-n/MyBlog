<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${article.title})}"></head>
<body>
<header th:replace="~{fragments/common :: header(${id})}"></header>
<article>
    <aside th:replace="~{fragments/common :: sidebar(${user}, ${album}, ${tags})}"></aside>
    <main>
        <div class="infosbox">
            <div class="newsview">
                <h3 class="news_title" th:text="${article.title}">文章标题</h3>
                <div class="bloginfo">
                    <ul>
                        <li class="author">作者：<a href="javascript:;" th:text="${user.name}">匿名用户</a></li>
                        <li class="timer">时间：<span th:text="${#temporals.format(article.created, 'yyyy-MM-dd')}">2026-01-01</span></li>
                        <li class="view">阅读量：<span th:text="${article.reading}">0</span></li>
                    </ul>
                </div>
                <div class="tags">
                    <a th:each="item : ${articleTags}" href="javascript:;" th:text="${item.tag}">标签</a>
                </div>
                <div class="news_con" th:utext="${article.content}">文章内容</div>
            </div>
            <div class="news_pl">
                <h2>文章评论</h2>
                <div class="gbko">
                    <div class="fb" th:each="item : ${comments}">
                        <ul style="background:url('/images/user.jpg') no-repeat top 20px left 10px">
                            <p class="fbtime"><span th:text="${#temporals.format(item.created, 'yyyy-MM-dd')}">日期</span>
                                <span th:text="${item.commentator}">评论用户</span></p>
                            <p class="fbinfo" th:text="${item.content}">评论内容</p>
                        </ul>
                    </div>
                    <form method="post" th:object="${commentForm}" name="saypl"
                          onsubmit="return CheckPl(document.saypl)">
                        <div id="plpost">
                            <p class="saying"><span><a href="javascript:;"
                                th:text="'共有' + ${#lists.size(comments)} + '条评论'">共有0条评论</a></span>来说两句吧...</p>
                            <p class="yname"><span>名称:</span>
                                <input th:field="*{name}" id="name" type="text" class="inputText" size="16">
                            </p>
                            <textarea th:field="*{content}" rows="6" id="saytext"></textarea>
                            <div th:if="${tips}" th:text="${tips}" style="color:#ba2121"></div>
                            <input name="submit" type="submit" value="提交">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</article>
<a href="#" class="cd-top">Top</a>
<script>
    function CheckPl(obj) {
        if (obj.saytext.value === "") { alert("请写下您想说的话！"); obj.saytext.focus(); return false; }
        if (obj.name.value === "") { alert("请写下您的名字！"); obj.name.focus(); return false; }
        return true;
    }
</script>
</body>
</html>
