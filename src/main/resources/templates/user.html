<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">登录博客</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/user.css">
    <script src="/js/jquery.min.js"></script>
    <script src="/js/user.js"></script>
</head>
<body>
<div class="page">
    <div class="loginwarrp">
        <div class="logo" th:text="${pageTitle}">用户登录</div>
        <div class="login_form">
            <form th:if="${confirmPassword}" th:object="${registerForm}" method="post">
                <li class="login-item">
                    <span>用户名：</span>
                    <input type="text" th:field="*{username}" class="login_input">
                    <span id="count-msg" class="error"></span>
                </li>
                <li class="login-item">
                    <span>密　码：</span>
                    <input type="password" th:field="*{password}" class="login_input">
                    <span id="password-msg" class="error"></span>
                </li>
                <li class="login-item">
                    <span>确认密码：</span>
                    <input type="password" th:field="*{confirmPassword}" class="login_input">
                    <span class="error"></span>
                </li>
                <div th:text="${tips}"></div>
                <li class="login-sub">
                    <input type="submit" name="Submit" th:value="${button}">
                    <div class="turn-url">
                        <a style="color:#45B572" th:href="${url}" th:text="'>>' + ${urlText}">用户登录</a>
                    </div>
                </li>
            </form>

            <form th:unless="${confirmPassword}" method="post">
                <li class="login-item">
                    <span>用户名：</span>
                    <input type="text" name="username" class="login_input">
                    <span id="count-msg-login" class="error"></span>
                </li>
                <li class="login-item">
                    <span>密　码：</span>
                    <input type="password" name="password" class="login_input">
                    <span id="password-msg-login" class="error"></span>
                </li>
                <div th:text="${tips}"></div>
                <li class="login-sub">
                    <input type="submit" name="Submit" th:value="${button}">
                    <div class="turn-url">
                        <a style="color:#45B572" th:href="${url}" th:text="'>>' + ${urlText}">用户注册</a>
                    </div>
                </li>
            </form>
        </div>
    </div>
</div>
<script>
    window.onload = function () {
        var config = {
            vx: 4, vy: 4, height: 2, width: 2, count: 100,
            color: "121, 162, 185", stroke: "100, 200, 180",
            dist: 6000, e_dist: 20000, max_conn: 10
        };
        CanvasParticle(config);
    };
</script>
<script src="/js/canvas-particle.js"></script>
</body>
</html>
